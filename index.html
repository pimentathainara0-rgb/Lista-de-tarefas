<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A fazeres</title>
    <link rel="stylesheet" href="main.css">
</head>
<body class="light-theme">
    <button class="btn">Dark</button>
    <!-- login -->
     <div id="loginArea">
        <h2>Entrar / Registrar</h2>
        <input id="loginUser" type="text" placeholder="Usuário">
        <input id="loginPass" type="password" placeholder="Senha">
        <div class="login-actions">
            <button id="btnLogin">Entrar</button>
            <button id="btnRegister">Registrar</button>
        </div>
        <p id="loginMsg"></p>
     </div>

     <!-- app content -->
      <div id="appContent" style="display:none;">
        <div class="Lista-tarefas">
            <h1>Lista de Tarefas</h1>

            <div class="calendar-row">
                <button id="prevDay" type="button">&#8249;</button>
                <input id="data" type="date">
                <button id="nextDay" type="button">&#8250;</button>
            </div>

            <h2 id="dataTitulo"></h2>
            <input id="tarefa" type="text" placeholder="Adicione uma tarefa">
            <button id="adicionar">Adicionar</button>
            <ul id="tarefas">
                <!--Tarefas serão exibidas aqui-->
            </ul>
        </div>
        <p id="msg">Para o meu amor! </p>
        <button id="btnLogout">Sair</button>
    </div>

    <script src="app.js"></script>
    <noscript>You need to enable JavaScript to view the full site</noscript>
</body>
</html>
